project:
   type: website

var:
  url-repo: https://github.com/iic-jku/analog-circuit-design   # to call this value : {{< meta var.url-repo >}}

website:
  title: "Analog (Integrated) Circuit Design"
  favicon: favicon.png
  navbar:
    background: "#447099"
    search: true
    left:
      - icon: house
        href: index.qmd
        text: "About"
      - href: aicd.qmd
        text: "Course Material"
      - icon: bi-filetype-pdf
        text: PDF
        href: aicd.pdf
    right:
      - icon: github
        href: "{{< meta var.url-repo >}}"
        target: "_blank"

  page-footer:
    right: | 
      Website built with [Quarto](https://quarto.org/){.external target="_blank"}
    left: |
      [Source code]({{< meta var.url-repo >}}){.external target="_blank"}

# Note: `freeze` is deliberately NOT enabled here. Since all content is pulled
# in via `{{< include >}}`, Quarto's freeze cache does not invalidate when a
# chapter is edited (it only tracks the rendering document, aicd.qmd), so it
# silently serves stale prose and can break the Typst/PDF build with errors
# pointing at text that was already fixed.

format:
  html:
    theme:
      light: cosmo
      dark: solar
    fig-align: center
    lang: en-US
    lightbox: true
