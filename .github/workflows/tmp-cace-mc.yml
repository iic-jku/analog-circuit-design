name: tmp-cace-mc

# TEMPORARY workflow: re-runs CACE for both OTA datasheets in the
# IIC-OSIC-TOOLS container to regenerate the reports in cace/_docs.
# It is removed again before the PR is merged.

on:
  workflow_dispatch:
  push:
    branches: [fix/ota-mc-mismatch]

permissions:
  contents: read

jobs:
  cace:
    name: Run CACE for OTA datasheets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: hpretl/iic-osic-tools:latest
      options: --user root
    env:
      PDK: ihp-sg13g2
      PDK_ROOT: /foss/pdks
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory '*'

      - name: Set up IIC-OSIC-TOOLS environment
        shell: bash
        run: |
          set -a
          source /etc/profile.d/iic-osic-tools-setup.sh
          set +a
          {
            echo "PATH=$PATH"
            echo "PYTHONPATH=$PYTHONPATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "CPATH=$CPATH"
            echo "PDK=$PDK"
            echo "PDKPATH=$PDKPATH"
            echo "PDK_ROOT=$PDK_ROOT"
            echo "SPICE_USERINIT_DIR=$SPICE_USERINIT_DIR"
          } >> "$GITHUB_ENV"

      - name: Show tool environment
        shell: bash
        run: |
          echo "cace    -> $(command -v cace || echo NOT FOUND)"
          cace --version || true
          xschem --version 2>&1 | head -n 1 || true
          ngspice --version 2>&1 | head -n 2 || true
          echo "xvfb-run -> $(command -v xvfb-run || echo NOT FOUND)"
          M="$PDK_ROOT/$PDK/libs.tech/ngspice/models"
          grep -n "^\.LIB mos_tt" "$M/cornerMOSlv.lib" "$M/cornerMOShv.lib" || true
          grep -n "mm_ok" "$PDK_ROOT/$PDK/libs.tech/xschem/sg13g2_pr/sg13_lv_nmos.sym" "$PDK_ROOT/$PDK/libs.tech/xschem/sg13g2_pr/sg13_lv_pmos.sym" || true

      - name: Make xschem recent_files safe for parallel runs
        # CACE starts many xschem processes in parallel; they all rewrite
        # ~/.xschem/recent_files, which gets corrupted and then makes every
        # later xschem call abort in Tcl_AppInit (c_toolbar array error).
        shell: bash
        run: |
          mkdir -p "$HOME/.xschem"
          ln -sf /dev/null "$HOME/.xschem/recent_files"
          ls -la "$HOME/.xschem"

      - name: Run CACE (ota-5t)
        timeout-minutes: 40
        shell: bash
        run: |
          unset DISPLAY
          cace cace/voltage-buffer-ota.yaml -s schematic --nofail --no-progress-bar 2>&1 | tee cace-ota-5t.log

      - name: Run CACE (ota-improved)
        timeout-minutes: 40
        shell: bash
        run: |
          unset DISPLAY
          cace cace/voltage-buffer-ota-improved.yaml -s schematic --nofail --no-progress-bar 2>&1 | tee cace-ota-improved.log

      - name: Post-process Markdown reports
        shell: bash
        run: |
          cd cace
          ./fix_report_md_ota-5t.sh
          ./fix_report_md_ota-improved.sh

      - name: Check mismatch is active in the MC netlists
        shell: bash
        run: |
          echo "--- MOSFET instances in DUT netlists (expect mm_ok=1):"
          grep -rn "sg13_lv_[np]mos" cace/netlist || true
          echo "--- .lib lines of an MC run (expect mos_tt_mismatch):"
          grep -rln "mos_tt_mismatch" _runs | head -n 5 || true
          grep -rh "^\.lib" $(grep -rln "mos_tt_mismatch" _runs | head -n 2) || true
          echo "--- MC results:"
          cat cace/scripts/ota-5t-ac.csv | head -n 20
          cat cace/scripts/ota-improved-ac.csv | head -n 20
          python3 - <<'EOF'
          import numpy as np
          for f in ["cace/scripts/ota-5t-ac.csv", "cace/scripts/ota-improved-ac.csv"]:
              d = np.loadtxt(f, delimiter=",", skiprows=1)
              g, b = d[:, 0], d[:, 1]
              print(f"{f}: N={len(g)} gain mean={g.mean():.5f} std={g.std(ddof=1):.5f} "
                    f"min={g.min():.5f} max={g.max():.5f} | "
                    f"bw mean={b.mean():.4e} std={b.std(ddof=1):.4e} min={b.min():.4e} max={b.max():.4e}")
          EOF
          git status --short
          git diff --stat

      - name: Upload CACE results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cace-results
          retention-days: 5
          path: |
            cace/_docs/
            cace/scripts/
            cace/netlist/
            cace-ota-5t.log
            cace-ota-improved.log
            _runs/*/summary.md
          if-no-files-found: warn

      - name: Upload CACE run directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cace-runs
          retention-days: 5
          path: _runs/
          if-no-files-found: warn
